[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "httpx>=0.28",
  "cryptography>=43",
  "tzdata>=2024.2",
  "anthropic>=1.0",
  "defusedxml>=0.7",
]

[tool.setuptools.packages.find]
include = ["nexus_core*"]

[tool.setuptools.package-data]
nexus_core = ["locales/*.json"]

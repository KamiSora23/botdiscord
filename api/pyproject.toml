[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["nexus-core", "fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["nexus_api*"]
